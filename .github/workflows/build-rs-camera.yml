
name: Inspect RS Camera Project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Android Gradle configuration
    runs-on: ubuntu-24.04

    steps:
      - name: Download RealSense source
        run: |
          git clone --depth 1 --branch v2.59.1 \
            https://github.com/realsenseai/librealsense.git source

      - name: Print Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          cd source/wrappers/android

          for FILE in \
            settings.gradle \
            build.gradle \
            gradle.properties \
            tools/camera/build.gradle \
            librealsense/build.gradle \
            readme.md
          do
            echo ""
            echo "=========================================="
            echo "FILE: $FILE"
            echo "=========================================="

            if [ -f "$FILE" ]; then
              sed -n '1,240p' "$FILE"
            else
              echo "FILE NOT FOUND"
            fi
          done

          echo ""
          echo "=========================================="
          echo "GRADLE WRAPPER FILES"
          echo "=========================================="

          find . -path '*/gradle/wrapper/*' \
            -type f -print

          echo ""
          echo "=========================================="
          echo "ANDROID MODULE STRUCTURE"
          echo "=========================================="

          find tools/camera -maxdepth 5 \
            -type f | sort | head -150

          echo ""
          echo "=========================================="
          echo "PLUGIN VERSION DECLARATIONS"
          echo "=========================================="

          grep -RInE \
            'com.android.tools.build:gradle|com.android.application.*version|com.android.library.*version|distributionUrl' \
            . \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --include='*.properties' || true

          echo ""
          echo "DIAGNOSTICS COMPLETED"
