name: Build RealSense 3D Studio APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RealSense 3D Studio
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # Download the pinned Intel RealSense source tree.
      - name: Checkout librealsense
        uses: actions/checkout@v4
        with:
          repository: realsenseai/librealsense
          ref: v2.59.1
          path: source

      # Fix the enum delimiter defect in the pinned Android wrapper source.
      - name: Fix Option.java enum syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "source/wrappers/android/librealsense/src/main/java/com/intel/realsense/librealsense/Option.java"
          )
          if not file.exists():
              raise SystemExit(f"File not found: {file}")

          content = file.read_text()
          old = "OPTION_SAFETY_MODE(96);"
          new = "OPTION_SAFETY_MODE(96),"
          count = content.count(old)
          if count != 1:
              raise SystemExit(f"Expected one occurrence of {old!r}, found {count}")

          file.write_text(content.replace(old, new, 1))
          print("Option.java enum syntax fixed")
          PY

      # Add a PLY snapshot export button to the existing RS Camera preview.
      # This exports one RGB-D frame; multi-frame SLAM/fusion is a later milestone.
      - name: Add local PLY snapshot export
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          app = Path("source/wrappers/android/tools/camera")
          java_dir = app / "src/main/java/com/intel/realsense/camera"
          layout_dir = app / "src/main/res/layout"
          activity_file = java_dir / "PreviewActivity.java"
          layout_file = layout_dir / "activity_preview.xml"

          if not activity_file.exists() or not layout_file.exists():
              raise SystemExit("Expected RealSense Camera preview sources were not found")

          def replace_once(content: str, old: str, new: str, label: str) -> str:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Patch anchor {label!r}: expected 1 match, found {count}")
              return content.replace(old, new, 1)

          activity = activity_file.read_text()
          activity = replace_once(
              activity,
              "import java.util.HashMap;\nimport java.util.Map;",
              "import java.util.HashMap;\nimport java.util.Map;\n"
              "import java.util.concurrent.ExecutorService;\n"
              "import java.util.concurrent.Executors;\n"
              "import java.util.concurrent.RejectedExecutionException;\n"
              "import java.util.concurrent.atomic.AtomicInteger;",
              "Java imports",
          )
          activity = replace_once(
              activity,
              "    private TextView mControlsButton;",
              "    private TextView mControlsButton;\n"
              "    private TextView mExportPlyButton;\n"
              "\n"
              "    // 0 = idle, 1 = waiting for the next frame, 2 = exporting.\n"
              "    private final AtomicInteger mPlyExportState = new AtomicInteger(0);\n"
              "    private final ExecutorService mPlyExportExecutor = Executors.newSingleThreadExecutor();",
              "PLY export fields",
          )
          activity = replace_once(
              activity,
              "        mControlsButton = findViewById(R.id.controls_button);",
              "        mControlsButton = findViewById(R.id.controls_button);\n"
              "        mExportPlyButton = findViewById(R.id.preview_export_ply_button);",
              "PLY button binding",
          )
          activity = replace_once(
              activity,
              "        mStatisticsButton.setOnClickListener(new View.OnClickListener() {",
              indent(dedent("""\
                      mExportPlyButton.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View view) {
                              if (mPlyExportState.compareAndSet(0, 1)) {
                                  Toast.makeText(PreviewActivity.this,
                                          "Сохраню облако точек со следующего кадра", Toast.LENGTH_SHORT).show();
                              } else {
                                  Toast.makeText(PreviewActivity.this,
                                          "Экспорт уже выполняется", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });

              """), "        ") + "        mStatisticsButton.setOnClickListener(new View.OnClickListener() {",
              "PLY button listener",
          )
          activity = replace_once(
              activity,
              "                mStreamingStats.onFrameset(frameSet);",
              indent(dedent("""\
                              mStreamingStats.onFrameset(frameSet);
                              if (mPlyExportState.compareAndSet(1, 2)) {
                                  final FrameSet snapshot = frameSet.clone();
                                  try {
                                      mPlyExportExecutor.execute(() -> {
                                          try {
                                              final String savedLocation = PlySnapshotExporter.export(
                                                      PreviewActivity.this, snapshot);
                                              runOnUiThread(() -> Toast.makeText(
                                                      PreviewActivity.this,
                                                      "PLY сохранён: " + savedLocation,
                                                      Toast.LENGTH_LONG).show());
                                          } catch (Exception e) {
                                              Log.e(TAG, "PLY export failed", e);
                                              final String message = e.getMessage() == null
                                                      ? e.getClass().getSimpleName() : e.getMessage();
                                              runOnUiThread(() -> Toast.makeText(
                                                      PreviewActivity.this,
                                                      "Ошибка экспорта PLY: " + message,
                                                      Toast.LENGTH_LONG).show());
                                          } finally {
                                              snapshot.close();
                                              mPlyExportState.set(0);
                                          }
                                      });
                                  } catch (RejectedExecutionException e) {
                                      snapshot.close();
                                      mPlyExportState.set(0);
                                      Log.e(TAG, "PLY export executor rejected the task", e);
                                  }
                              }
              """), "                "),
              "frame callback export hook",
          )
          activity = replace_once(
              activity,
              "    protected void onDestroy() {\n        super.onDestroy();\n        mGLSurfaceView.close();\n    }",
              "    protected void onDestroy() {\n"
              "        super.onDestroy();\n"
              "        mPlyExportExecutor.shutdown();\n"
              "        mGLSurfaceView.close();\n"
              "    }",
              "export executor shutdown",
          )
          activity_file.write_text(activity)

          layout = layout_file.read_text()
          layout = replace_once(
              layout,
              '            android:text="3D"/>',
              '            android:text="3D"/>\n\n'
              '        <Space\n'
              '            android:layout_width="0dp"\n'
              '            android:layout_height="1dp"\n'
              '            android:layout_weight="1" />\n\n'
              '        <TextView\n'
              '            android:id="@+id/preview_export_ply_button"\n'
              '            android:layout_width="wrap_content"\n'
              '            android:layout_height="wrap_content"\n'
              '            android:clickable="true"\n'
              '            android:textSize="14dp"\n'
              '            android:textColor="#ffffff"\n'
              '            android:backgroundTint="#000000"\n'
              '            android:text="PLY"/>',
              "PLY button layout",
          )
          layout_file.write_text(layout)

          strings_file = app / "src/main/res/values/strings.xml"
          strings = strings_file.read_text()
          strings = replace_once(
              strings,
              '<string name="app_name">RS Camera</string>',
              '<string name="app_name">RealSense 3D Studio</string>',
              "app display name",
          )
          strings_file.write_text(strings)

          exporter_file = java_dir / "PlySnapshotExporter.java"
          exporter_source = dedent("""\
              package com.intel.realsense.camera;

              import android.content.ContentResolver;
              import android.content.ContentValues;
              import android.content.Context;
              import android.net.Uri;
              import android.os.Build;
              import android.os.Environment;
              import android.provider.MediaStore;

              import com.intel.realsense.librealsense.Extension;
              import com.intel.realsense.librealsense.Frame;
              import com.intel.realsense.librealsense.FrameSet;
              import com.intel.realsense.librealsense.Pointcloud;
              import com.intel.realsense.librealsense.Points;
              import com.intel.realsense.librealsense.StreamType;
              import com.intel.realsense.librealsense.VideoFrame;

              import java.io.File;
              import java.io.FileInputStream;
              import java.io.IOException;
              import java.io.InputStream;
              import java.io.OutputStream;
              import java.text.SimpleDateFormat;
              import java.util.Date;
              import java.util.Locale;

              /** Exports one synchronized RealSense depth/color frame as a colored PLY point cloud. */
              public final class PlySnapshotExporter {
                  private PlySnapshotExporter() { }

                  public static String export(Context context, FrameSet frames) throws Exception {
                      File documents = context.getExternalFilesDir(Environment.DIRECTORY_DOCUMENTS);
                      if (documents == null) {
                          throw new IOException("External app storage is unavailable");
                      }

                      File outputDir = new File(documents, "RealSense3D");
                      if (!outputDir.exists() && !outputDir.mkdirs()) {
                          throw new IOException("Cannot create " + outputDir.getAbsolutePath());
                      }

                      String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss_SSS", Locale.US)
                              .format(new Date());
                      File output = new File(outputDir, "scan_" + stamp + ".ply");
                      boolean complete = false;

                      try (Frame depth = frames.first(StreamType.DEPTH);
                           Frame color = frames.first(StreamType.COLOR)) {
                          if (depth == null) {
                              throw new IllegalStateException("Depth stream is missing. Enable Depth in Settings.");
                          }
                          if (color == null) {
                              throw new IllegalStateException("Color stream is missing. Enable Color in Settings.");
                          }
                          if (!depth.is(Extension.DEPTH_FRAME)) {
                              throw new IllegalStateException("The received Depth frame has an unsupported format.");
                          }
                          if (!color.is(Extension.VIDEO_FRAME)) {
                              throw new IllegalStateException("The received Color frame has an unsupported format.");
                          }

                          try (Pointcloud pointcloud = new Pointcloud(StreamType.COLOR)) {
                              Frame pointsFrame = pointcloud.process(depth);
                              if (pointsFrame == depth) {
                                  throw new IllegalStateException("RealSense did not produce a point cloud.");
                              }
                              try {
                                  if (!pointsFrame.is(Extension.POINTS)) {
                                      throw new IllegalStateException("Point cloud output is not valid.");
                                  }
                                  Points points = pointsFrame.as(Extension.POINTS);
                                  VideoFrame texture = color.as(Extension.VIDEO_FRAME);
                                  points.exportToPly(output.getAbsolutePath(), texture);
                              } finally {
                                  pointsFrame.close();
                              }
                          }

                          if (!output.isFile() || output.length() == 0) {
                              throw new IOException("PLY file was not created or is empty");
                          }

                          String location = publishToDownloads(context, output);
                          complete = true;
                          return location;
                      } finally {
                          if (!complete && output.exists()) {
                              //noinspection ResultOfMethodCallIgnored
                              output.delete();
                          }
                      }
                  }

                  private static String publishToDownloads(Context context, File source) throws Exception {
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                          return source.getAbsolutePath();
                      }

                      ContentResolver resolver = context.getContentResolver();
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, source.getName());
                      values.put(MediaStore.MediaColumns.MIME_TYPE, "application/octet-stream");
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH,
                              Environment.DIRECTORY_DOWNLOADS + "/RealSense3D");
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                      Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) {
                          throw new IOException("Could not create a file in Downloads/RealSense3D");
                      }

                      try {
                          try (InputStream input = new FileInputStream(source);
                               OutputStream output = resolver.openOutputStream(uri)) {
                              if (output == null) {
                                  throw new IOException("Could not open the exported PLY destination");
                              }
                              byte[] buffer = new byte[64 * 1024];
                              int count;
                              while ((count = input.read(buffer)) != -1) {
                                  output.write(buffer, 0, count);
                              }
                              output.flush();
                          }

                          ContentValues publish = new ContentValues();
                          publish.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          if (resolver.update(uri, publish, null, null) < 1) {
                              throw new IOException("Could not publish the PLY file in Downloads");
                          }

                          //noinspection ResultOfMethodCallIgnored
                          source.delete();
                          return "Downloads/RealSense3D/" + source.getName();
                      } catch (Exception e) {
                          resolver.delete(uri, null, null);
                          throw e;
                      }
                  }
              }
              """)
          if exporter_file.exists():
              raise SystemExit(f"Refusing to overwrite unexpected existing file: {exporter_file}")
          exporter_file.write_text(exporter_source)

          print("Added PLY snapshot export to the RealSense Camera app")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build RealSense 3D Studio
        working-directory: source/wrappers/android
        shell: bash
        run: |
          gradle :tools:camera:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealSense-3D-Studio-APK
          path: source/wrappers/android/tools/camera/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
