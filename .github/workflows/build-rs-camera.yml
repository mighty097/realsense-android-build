name: Build RealSense 3D Scanner APK (v0.1.1)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone RealSense 3D Scanner v0.1.1
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout librealsense v2.59.1
        uses: actions/checkout@v4
        with:
          repository: realsenseai/librealsense
          ref: v2.59.1
          path: source

      - name: Fix Option.java enum syntax in pinned SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/wrappers/android/librealsense/src/main/java/com/intel/realsense/librealsense/Option.java")
          s = p.read_text()
          old = "OPTION_SAFETY_MODE(96);"
          if s.count(old) != 1:
              raise SystemExit(f"Expected one occurrence of {old!r}; found {s.count(old)}")
          p.write_text(s.replace(old, "OPTION_SAFETY_MODE(96),", 1))
          print("Fixed the pinned SDK enum delimiter")
          PY

