          bundle = Path("/tmp/rs3d_bundle")
          bundle.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded))) as archive:
              archive.extractall(bundle)

          module = Path("source/wrappers/android/tools/scanner")
          module.mkdir(parents=True, exist_ok=True)
          shutil.copytree(bundle / "app", module / "app", dirs_exist_ok=True)
          shutil.copytree(bundle / "tests", module / "tests", dirs_exist_ok=True)

          # The librealsense library manifest declares android:allowBackup=true.
          # Explicitly keep the standalone scanner's false value during manifest merge.
          manifest = module / "app/src/main/AndroidManifest.xml"
          manifest_text = manifest.read_text()
          root_tag = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          root_tag_fixed = '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n          xmlns:tools="http://schemas.android.com/tools">'
          if manifest_text.count(root_tag) != 1:
              raise SystemExit("Could not find the expected scanner manifest root tag")
          manifest_text = manifest_text.replace(root_tag, root_tag_fixed, 1)
          app_tag = '<application\n        android:allowBackup="false"'
          app_tag_fixed = '<application\n        android:allowBackup="false"\n        tools:replace="android:allowBackup"'
          if manifest_text.count(app_tag) != 1:
              raise SystemExit("Could not find the expected application allowBackup attribute")
          manifest_text = manifest_text.replace(app_tag, app_tag_fixed, 1)
          manifest.write_text(manifest_text)
          print("Resolved app/library manifest allowBackup conflict")

          settings = Path("source/wrappers/android/settings.gradle")
          text = settings.read_text()
          include = "include ':tools:scanner:app'"
          if include not in text:
              anchor = "include ':tools:camera'"
              if text.count(anchor) != 1:
                  raise SystemExit("Could not find the Android tools module anchor in settings.gradle")
              text = text.replace(anchor, anchor + "\n" + include, 1)
          settings.write_text(text)
          print("Standalone scanner module injected")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Test native ICP and voxel fusion
        shell: bash
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra \
            source/wrappers/android/tools/scanner/tests/scan_fusion_host_test.cpp \
            source/wrappers/android/tools/scanner/app/src/main/cpp/scan_fusion_core.cpp \
            -o /tmp/scan_fusion_host_test
          /tmp/scan_fusion_host_test

      - name: Build standalone Android scanner
        working-directory: source/wrappers/android
        shell: bash
        run: gradle :tools:scanner:app:assembleDebug --no-daemon --stacktrace

      - name: Upload scanner APK
        uses: actions/upload-artifact@v4
        with:
          name: RealSense-3D-Scanner-APK
          path: source/wrappers/android/tools/scanner/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
