name: Build RealSense 3D Studio APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RealSense 3D Studio
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # Download the pinned Intel RealSense source tree.
      - name: Checkout librealsense
        uses: actions/checkout@v4
        with:
          repository: realsenseai/librealsense
          ref: v2.59.1
          path: source

      # Fix the enum delimiter defect in the pinned Android wrapper source.
      - name: Fix Option.java enum syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "source/wrappers/android/librealsense/src/main/java/com/intel/realsense/librealsense/Option.java"
          )
          if not file.exists():
              raise SystemExit(f"File not found: {file}")

          content = file.read_text()
          old = "OPTION_SAFETY_MODE(96);"
          new = "OPTION_SAFETY_MODE(96),"
          count = content.count(old)
          if count != 1:
              raise SystemExit(f"Expected one occurrence of {old!r}, found {count}")

          file.write_text(content.replace(old, new, 1))
          print("Option.java enum syntax fixed")
          PY

      # Add a PLY snapshot export button to the existing RS Camera preview.
      # Retains single-frame PLY capture as a fallback when no fused scan exists.
      - name: Add local PLY snapshot export
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          app = Path("source/wrappers/android/tools/camera")
          java_dir = app / "src/main/java/com/intel/realsense/camera"
          layout_dir = app / "src/main/res/layout"
          activity_file = java_dir / "PreviewActivity.java"
          layout_file = layout_dir / "activity_preview.xml"

          if not activity_file.exists() or not layout_file.exists():
              raise SystemExit("Expected RealSense Camera preview sources were not found")

          def replace_once(content: str, old: str, new: str, label: str) -> str:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Patch anchor {label!r}: expected 1 match, found {count}")
              return content.replace(old, new, 1)

          activity = activity_file.read_text()
          activity = replace_once(
              activity,
              "import java.util.HashMap;\nimport java.util.Map;",
              "import java.util.HashMap;\nimport java.util.Map;\n"
              "import java.util.concurrent.ExecutorService;\n"
              "import java.util.concurrent.Executors;\n"
              "import java.util.concurrent.RejectedExecutionException;\n"
              "import java.util.concurrent.atomic.AtomicInteger;",
              "Java imports",
          )
          activity = replace_once(
              activity,
              "    private TextView mControlsButton;",
              "    private TextView mControlsButton;\n"
              "    private TextView mExportPlyButton;\n"
              "\n"
              "    // 0 = idle, 1 = waiting for the next frame, 2 = exporting.\n"
              "    private final AtomicInteger mPlyExportState = new AtomicInteger(0);\n"
              "    private final ExecutorService mPlyExportExecutor = Executors.newSingleThreadExecutor();",
              "PLY export fields",
          )
          activity = replace_once(
              activity,
              "        mControlsButton = findViewById(R.id.controls_button);",
              "        mControlsButton = findViewById(R.id.controls_button);\n"
              "        mExportPlyButton = findViewById(R.id.preview_export_ply_button);",
              "PLY button binding",
          )
          activity = replace_once(
              activity,
              "        mStatisticsButton.setOnClickListener(new View.OnClickListener() {",
              indent(dedent("""\
                      mExportPlyButton.setOnClickListener(new View.OnClickListener() {
                          @Override
                          public void onClick(View view) {
                              if (mPlyExportState.compareAndSet(0, 1)) {
                                  Toast.makeText(PreviewActivity.this,
                                          "Сохраню облако точек со следующего кадра", Toast.LENGTH_SHORT).show();
                              } else {
                                  Toast.makeText(PreviewActivity.this,
                                          "Экспорт уже выполняется", Toast.LENGTH_SHORT).show();
                              }
                          }
                      });

              """), "        ") + "        mStatisticsButton.setOnClickListener(new View.OnClickListener() {",
              "PLY button listener",
          )
          activity = replace_once(
              activity,
              "                mStreamingStats.onFrameset(frameSet);",
              indent(dedent("""\
                              mStreamingStats.onFrameset(frameSet);
                              if (mPlyExportState.compareAndSet(1, 2)) {
                                  final FrameSet snapshot = frameSet.clone();
                                  try {
                                      mPlyExportExecutor.execute(() -> {
                                          try {
                                              final String savedLocation = PlySnapshotExporter.export(
                                                      PreviewActivity.this, snapshot);
                                              runOnUiThread(() -> Toast.makeText(
                                                      PreviewActivity.this,
                                                      "PLY сохранён: " + savedLocation,
                                                      Toast.LENGTH_LONG).show());
                                          } catch (Exception e) {
                                              Log.e(TAG, "PLY export failed", e);
                                              final String message = e.getMessage() == null
                                                      ? e.getClass().getSimpleName() : e.getMessage();
                                              runOnUiThread(() -> Toast.makeText(
                                                      PreviewActivity.this,
                                                      "Ошибка экспорта PLY: " + message,
                                                      Toast.LENGTH_LONG).show());
                                          } finally {
                                              snapshot.close();
                                              mPlyExportState.set(0);
                                          }
                                      });
                                  } catch (RejectedExecutionException e) {
                                      snapshot.close();
                                      mPlyExportState.set(0);
                                      Log.e(TAG, "PLY export executor rejected the task", e);
                                  }
                              }
              """), "                "),
              "frame callback export hook",
          )
          activity = replace_once(
              activity,
              "    protected void onDestroy() {\n        super.onDestroy();\n        mGLSurfaceView.close();\n    }",
              "    protected void onDestroy() {\n"
              "        super.onDestroy();\n"
              "        mPlyExportExecutor.shutdown();\n"
              "        mGLSurfaceView.close();\n"
              "    }",
              "export executor shutdown",
          )
          activity_file.write_text(activity)

          layout = layout_file.read_text()
          layout = replace_once(
              layout,
              '            android:text="3D"/>',
              '            android:text="3D"/>\n\n'
              '        <Space\n'
              '            android:layout_width="0dp"\n'
              '            android:layout_height="1dp"\n'
              '            android:layout_weight="1" />\n\n'
              '        <TextView\n'
              '            android:id="@+id/preview_export_ply_button"\n'
              '            android:layout_width="wrap_content"\n'
              '            android:layout_height="wrap_content"\n'
              '            android:clickable="true"\n'
              '            android:textSize="14dp"\n'
              '            android:textColor="#ffffff"\n'
              '            android:backgroundTint="#000000"\n'
              '            android:text="PLY"/>',
              "PLY button layout",
          )
          layout_file.write_text(layout)

          strings_file = app / "src/main/res/values/strings.xml"
          strings = strings_file.read_text()
          strings = replace_once(
              strings,
              '<string name="app_name">RS Camera</string>',
              '<string name="app_name">RealSense 3D Studio</string>',
              "app display name",
          )
          strings_file.write_text(strings)

          exporter_file = java_dir / "PlySnapshotExporter.java"
          exporter_source = dedent("""\
              package com.intel.realsense.camera;

              import android.content.ContentResolver;
              import android.content.ContentValues;
              import android.content.Context;
              import android.net.Uri;
              import android.os.Build;
              import android.os.Environment;
              import android.provider.MediaStore;

              import com.intel.realsense.librealsense.Extension;
              import com.intel.realsense.librealsense.Frame;
              import com.intel.realsense.librealsense.FrameSet;
              import com.intel.realsense.librealsense.Pointcloud;
              import com.intel.realsense.librealsense.Points;
              import com.intel.realsense.librealsense.StreamType;
              import com.intel.realsense.librealsense.VideoFrame;

              import java.io.File;
              import java.io.FileInputStream;
              import java.io.IOException;
              import java.io.InputStream;
              import java.io.OutputStream;
              import java.text.SimpleDateFormat;
              import java.util.Date;
              import java.util.Locale;

              /** Exports one synchronized RealSense depth/color frame as a colored PLY point cloud. */
              public final class PlySnapshotExporter {
                  private PlySnapshotExporter() { }

                  public static String export(Context context, FrameSet frames) throws Exception {
                      File documents = context.getExternalFilesDir(Environment.DIRECTORY_DOCUMENTS);
                      if (documents == null) {
                          throw new IOException("External app storage is unavailable");
                      }

                      File outputDir = new File(documents, "RealSense3D");
                      if (!outputDir.exists() && !outputDir.mkdirs()) {
                          throw new IOException("Cannot create " + outputDir.getAbsolutePath());
                      }

                      String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss_SSS", Locale.US)
                              .format(new Date());
                      File output = new File(outputDir, "scan_" + stamp + ".ply");
                      boolean complete = false;

                      try (Frame depth = frames.first(StreamType.DEPTH);
                           Frame color = frames.first(StreamType.COLOR)) {
                          if (depth == null) {
                              throw new IllegalStateException("Depth stream is missing. Enable Depth in Settings.");
                          }
                          if (color == null) {
                              throw new IllegalStateException("Color stream is missing. Enable Color in Settings.");
                          }
                          if (!depth.is(Extension.DEPTH_FRAME)) {
                              throw new IllegalStateException("The received Depth frame has an unsupported format.");
                          }
                          if (!color.is(Extension.VIDEO_FRAME)) {
                              throw new IllegalStateException("The received Color frame has an unsupported format.");
                          }

                          try (Pointcloud pointcloud = new Pointcloud(StreamType.COLOR)) {
                              Frame pointsFrame = pointcloud.process(depth);
                              if (pointsFrame == depth) {
                                  throw new IllegalStateException("RealSense did not produce a point cloud.");
                              }
                              try {
                                  if (!pointsFrame.is(Extension.POINTS)) {
                                      throw new IllegalStateException("Point cloud output is not valid.");
                                  }
                                  Points points = pointsFrame.as(Extension.POINTS);
                                  VideoFrame texture = color.as(Extension.VIDEO_FRAME);
                                  points.exportToPly(output.getAbsolutePath(), texture);
                              } finally {
                                  pointsFrame.close();
                              }
                          }

                          if (!output.isFile() || output.length() == 0) {
                              throw new IOException("PLY file was not created or is empty");
                          }

                          String location = publishToDownloads(context, output);
                          complete = true;
                          return location;
                      } finally {
                          if (!complete && output.exists()) {
                              //noinspection ResultOfMethodCallIgnored
                              output.delete();
                          }
                      }
                  }

                  private static String publishToDownloads(Context context, File source) throws Exception {
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                          return source.getAbsolutePath();
                      }

                      ContentResolver resolver = context.getContentResolver();
                      ContentValues values = new ContentValues();
                      values.put(MediaStore.MediaColumns.DISPLAY_NAME, source.getName());
                      values.put(MediaStore.MediaColumns.MIME_TYPE, "application/octet-stream");
                      values.put(MediaStore.MediaColumns.RELATIVE_PATH,
                              Environment.DIRECTORY_DOWNLOADS + "/RealSense3D");
                      values.put(MediaStore.MediaColumns.IS_PENDING, 1);

                      Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                      if (uri == null) {
                          throw new IOException("Could not create a file in Downloads/RealSense3D");
                      }

                      try {
                          try (InputStream input = new FileInputStream(source);
                               OutputStream output = resolver.openOutputStream(uri)) {
                              if (output == null) {
                                  throw new IOException("Could not open the exported PLY destination");
                              }
                              byte[] buffer = new byte[64 * 1024];
                              int count;
                              while ((count = input.read(buffer)) != -1) {
                                  output.write(buffer, 0, count);
                              }
                              output.flush();
                          }

                          ContentValues publish = new ContentValues();
                          publish.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          if (resolver.update(uri, publish, null, null) < 1) {
                              throw new IOException("Could not publish the PLY file in Downloads");
                          }

                          //noinspection ResultOfMethodCallIgnored
                          source.delete();
                          return "Downloads/RealSense3D/" + source.getName();
                      } catch (Exception e) {
                          resolver.delete(uri, null, null);
                          throw e;
                      }
                  }
              }
              """)
          if exporter_file.exists():
              raise SystemExit(f"Refusing to overwrite unexpected existing file: {exporter_file}")
          exporter_file.write_text(exporter_source)

          print("Added PLY snapshot export to the RealSense Camera app")
          PY

      # Add live ICP registration, asynchronous fusion, and a persistent on-screen cloud.
      - name: Add live point-cloud scan fusion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          app = Path("source/wrappers/android/tools/camera")
          java_dir = app / "src/main/java/com/intel/realsense/camera"
          rs_java = Path("source/wrappers/android/librealsense/src/main/java/com/intel/realsense/librealsense")
          activity_file = java_dir / "PreviewActivity.java"
          layout_file = app / "src/main/res/layout/activity_preview.xml"
          renderer_file = rs_java / "GLRenderer.java"
          points_view_file = rs_java / "GLPointsFrame.java"
          rs_surface_file = rs_java / "GLRsSurfaceView.java"
          exporter_file = java_dir / "PlySnapshotExporter.java"
          app_gradle_file = app / "build.gradle"

          for required in (activity_file, layout_file, renderer_file, points_view_file, rs_surface_file, exporter_file, app_gradle_file):
              if not required.exists():
                  raise SystemExit(f"Required source file not found: {required}")

          def replace_once(content: str, old: str, new: str, label: str) -> str:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f"Patch anchor {label!r}: expected exactly 1 match, found {count}")
              return content.replace(old, new, 1)

          # 1) Add the on-device incremental ICP fusion engine.
          fusion_file = rs_java / "PointCloudFusion.java"
          if fusion_file.exists():
              raise SystemExit(f"Refusing to overwrite unexpected file: {fusion_file}")
          fusion_file.write_text(dedent(r'''
              package com.intel.realsense.librealsense;

              import java.io.BufferedWriter;
              import java.io.File;
              import java.io.FileWriter;
              import java.io.IOException;
              import java.util.HashMap;
              import java.util.Locale;
              import java.util.Map;

              /**
               * Incremental RGB-D point-cloud fusion using lightweight point-to-point ICP.
               * Coordinates are expressed in the first accepted camera frame. This is an
               * online fusion preview, not a loop-closing SLAM or watertight-mesh system.
               */
              public final class PointCloudFusion {
                  private static final int MAX_POINTS = 120000;
                  private static final int MAX_ICP_SAMPLES = 700;
                  private static final int MAX_FRAME_POINTS = 3500;
                  private static final float VOXEL_SIZE = 0.015f;
                  private static final float CELL_SIZE = 0.10f;
                  private static final float MAX_DISTANCE = 0.09f;
                  private static final float MAX_DISTANCE_SQ = MAX_DISTANCE * MAX_DISTANCE;
                  private static final int ICP_ITERATIONS = 6;
                  private static final long MIN_INTERVAL_NS = 70_000_000L;

                  private final float[] mapXYZ = new float[MAX_POINTS * 3];
                  private final byte[] mapRGBA = new byte[MAX_POINTS * 4];
                  private final int[] mapSamples = new int[MAX_POINTS];
                  private volatile int mapCount = 0;
                  private final Map<Long, Integer> voxelIndex = new HashMap<>();
                  private final Map<Long, IntBucket> spatialIndex = new HashMap<>();

                  // Rigid transform from current camera coordinates into the map frame.
                  private float[] poseR = identity3();
                  private float[] poseT = new float[3];
                  private boolean havePose = false;
                  private volatile boolean tracking = false;
                  private int acceptedFrames = 0;
                  private int rejectedFrames = 0;
                  private volatile long lastFusionNs = 0;
                  private volatile int sessionId = 0;

                  public static final class Snapshot {
                      public final float[] vertices;
                      public final byte[] colors;
                      public final int pointCount;
                      private Snapshot(float[] vertices, byte[] colors, int pointCount) {
                          this.vertices = vertices;
                          this.colors = colors;
                          this.pointCount = pointCount;
                      }
                  }

                  private static final class IntBucket {
                      int[] values = new int[8];
                      int size = 0;
                      void add(int value) {
                          if (size == values.length) {
                              int[] next = new int[values.length * 2];
                              System.arraycopy(values, 0, next, 0, size);
                              values = next;
                          }
                          values[size++] = value;
                      }
                  }

                  private static final class PoseResult {
                      final float[] rotation;
                      final float[] translation;
                      final float rmse;
                      final int correspondences;
                      PoseResult(float[] rotation, float[] translation, float rmse, int correspondences) {
                          this.rotation = rotation;
                          this.translation = translation;
                          this.rmse = rmse;
                          this.correspondences = correspondences;
                      }
                  }

                  public synchronized void reset() {
                      sessionId++;
                      mapCount = 0;
                      voxelIndex.clear();
                      spatialIndex.clear();
                      poseR = identity3();
                      poseT = new float[3];
                      havePose = false;
                      tracking = false;
                      acceptedFrames = 0;
                      rejectedFrames = 0;
                      lastFusionNs = 0;
                  }

                  public int getPointCount() { return mapCount; }
                  public boolean isTracking() { return tracking; }
                  public synchronized int getAcceptedFrames() { return acceptedFrames; }
                  public synchronized int getRejectedFrames() { return rejectedFrames; }
                  public int getSessionId() { return sessionId; }
                  public boolean shouldIntegrateNow() {
                      return lastFusionNs == 0 || System.nanoTime() - lastFusionNs >= MIN_INTERVAL_NS;
                  }

                  /** Returns true only when the frame was registered and fused. */
                  public synchronized boolean integrate(float[] vertices, byte[] rgba) {
                      return integrate(vertices, rgba, sessionId);
                  }

                  public synchronized boolean integrate(float[] vertices, byte[] rgba, int expectedSessionId) {
                      if (expectedSessionId != sessionId) return false;
                      if (vertices == null || vertices.length < 300) return false;
                      long now = System.nanoTime();
                      if (lastFusionNs != 0 && now - lastFusionNs < MIN_INTERVAL_NS) return false;
                      lastFusionNs = now; // throttle failed registrations too, not only successful fusions

                      int sourceCount = vertices.length / 3;
                      float[] samples = collectSamples(vertices, sourceCount);
                      int sampleCount = samples.length / 3;
                      if (sampleCount < 25) {
                          tracking = false;
                          rejectedFrames++;
                          return false;
                      }

                      if (mapCount == 0 || !havePose) {
                          poseR = identity3();
                          poseT = new float[3];
                          havePose = true;
                          addFrameToMap(vertices, rgba, sourceCount, poseR, poseT);
                          tracking = mapCount > 0;
                          if (tracking) {
                              acceptedFrames++;
                              lastFusionNs = now;
                          }
                          return tracking;
                      }

                      PoseResult result = register(samples, sampleCount);
                      if (result == null) {
                          tracking = false;
                          rejectedFrames++;
                          return false;
                      }

                      poseR = result.rotation;
                      poseT = result.translation;
                      addFrameToMap(vertices, rgba, sourceCount, poseR, poseT);
                      tracking = true;
                      acceptedFrames++;
                      lastFusionNs = now;
                      return true;
                  }

                  private float[] collectSamples(float[] vertices, int pointCount) {
                      int step = Math.max(1, (pointCount + MAX_ICP_SAMPLES - 1) / MAX_ICP_SAMPLES);
                      float[] tmp = new float[Math.min(MAX_ICP_SAMPLES, pointCount) * 3];
                      int out = 0;
                      for (int i = 0; i < pointCount && out + 2 < tmp.length; i += step) {
                          int k = i * 3;
                          float x = vertices[k], y = vertices[k + 1], z = vertices[k + 2];
                          if (!validPoint(x, y, z)) continue;
                          tmp[out++] = x; tmp[out++] = y; tmp[out++] = z;
                      }
                      float[] result = new float[out];
                      System.arraycopy(tmp, 0, result, 0, out);
                      return result;
                  }

                  private boolean validPoint(float x, float y, float z) {
                      return Float.isFinite(x) && Float.isFinite(y) && Float.isFinite(z)
                              && z > 0.18f && z < 8.0f
                              && Math.abs(x) < 8.0f && Math.abs(y) < 8.0f;
                  }

                  private PoseResult register(float[] samples, int sampleCount) {
                      float[] r = poseR.clone();
                      float[] t = poseT.clone();
                      float[] src = new float[sampleCount * 3];
                      float[] dst = new float[sampleCount * 3];
                      int lastMatches = 0;
                      float lastRmse = Float.POSITIVE_INFINITY;

                      for (int iteration = 0; iteration < ICP_ITERATIONS; iteration++) {
                          int matches = 0;
                          double errorSum = 0.0;
                          for (int i = 0; i < sampleCount; i++) {
                              int k = i * 3;
                              float x = samples[k], y = samples[k + 1], z = samples[k + 2];
                              float wx = r[0] * x + r[1] * y + r[2] * z + t[0];
                              float wy = r[3] * x + r[4] * y + r[5] * z + t[1];
                              float wz = r[6] * x + r[7] * y + r[8] * z + t[2];
                              int nearest = findNearest(wx, wy, wz);
                              if (nearest < 0) continue;
                              float dx = wx - mapXYZ[nearest * 3];
                              float dy = wy - mapXYZ[nearest * 3 + 1];
                              float dz = wz - mapXYZ[nearest * 3 + 2];
                              float d2 = dx * dx + dy * dy + dz * dz;
                              if (d2 > MAX_DISTANCE_SQ) continue;
                              int q = matches * 3;
                              src[q] = wx; src[q + 1] = wy; src[q + 2] = wz;
                              dst[q] = mapXYZ[nearest * 3];
                              dst[q + 1] = mapXYZ[nearest * 3 + 1];
                              dst[q + 2] = mapXYZ[nearest * 3 + 2];
                              errorSum += d2;
                              matches++;
                          }

                          int minimum = Math.max(25, sampleCount / 12);
                          if (matches < minimum) return null;
                          float rmse = (float) Math.sqrt(errorSum / matches);
                          float[] deltaR = new float[9];
                          float[] deltaT = new float[3];
                          if (!solveRigid(src, dst, matches, deltaR, deltaT)) return null;
                          float shift = length(deltaT[0], deltaT[1], deltaT[2]);
                          float angle = rotationAngle(deltaR);
                          // Reject large jumps rather than painting a visibly doubled scan.
                          if (shift > 0.16f || angle > 0.65f) return null;

                          t = multiplyVector(deltaR, t);
                          t[0] += deltaT[0]; t[1] += deltaT[1]; t[2] += deltaT[2];
                          r = multiply3(deltaR, r);
                          lastMatches = matches;
                          lastRmse = rmse;
                          if (shift < 0.0015f && angle < 0.002f) break;
                      }

                      int verified = 0;
                      double verifyError = 0.0;
                      for (int i = 0; i < sampleCount; i++) {
                          int k = i * 3;
                          float x = r[0] * samples[k] + r[1] * samples[k + 1] + r[2] * samples[k + 2] + t[0];
                          float y = r[3] * samples[k] + r[4] * samples[k + 1] + r[5] * samples[k + 2] + t[1];
                          float z = r[6] * samples[k] + r[7] * samples[k + 1] + r[8] * samples[k + 2] + t[2];
                          int nearest = findNearest(x, y, z);
                          if (nearest < 0) continue;
                          float dx = x - mapXYZ[nearest * 3];
                          float dy = y - mapXYZ[nearest * 3 + 1];
                          float dz = z - mapXYZ[nearest * 3 + 2];
                          float d2 = dx * dx + dy * dy + dz * dz;
                          if (d2 <= MAX_DISTANCE_SQ) { verifyError += d2; verified++; }
                      }
                      int minimum = Math.max(25, sampleCount / 12);
                      if (verified < minimum) return null;
                      float rmse = (float) Math.sqrt(verifyError / verified);
                      if (!Float.isFinite(rmse) || rmse > 0.065f) return null;
                      if (lastMatches < minimum || lastRmse > 0.075f) return null;
                      return new PoseResult(r, t, rmse, verified);
                  }

                  private int findNearest(float x, float y, float z) {
                      int cx = floorCell(x), cy = floorCell(y), cz = floorCell(z);
                      int best = -1;
                      float bestD2 = MAX_DISTANCE_SQ;
                      for (int dx = -1; dx <= 1; dx++) for (int dy = -1; dy <= 1; dy++)
                          for (int dz = -1; dz <= 1; dz++) {
                              IntBucket bucket = spatialIndex.get(pack(cx + dx, cy + dy, cz + dz));
                              if (bucket == null) continue;
                              for (int j = 0; j < bucket.size; j++) {
                                  int idx = bucket.values[j], k = idx * 3;
                                  float ax = x - mapXYZ[k], ay = y - mapXYZ[k + 1], az = z - mapXYZ[k + 2];
                                  float d2 = ax * ax + ay * ay + az * az;
                                  if (d2 < bestD2) { bestD2 = d2; best = idx; }
                              }
                          }
                      return best;
                  }

                  private void addFrameToMap(float[] vertices, byte[] rgba, int pointCount,
                                             float[] r, float[] t) {
                      int step = Math.max(1, (pointCount + MAX_FRAME_POINTS - 1) / MAX_FRAME_POINTS);
                      for (int i = 0; i < pointCount; i += step) {
                          int k = i * 3;
                          float x = vertices[k], y = vertices[k + 1], z = vertices[k + 2];
                          if (!validPoint(x, y, z)) continue;
                          float wx = r[0] * x + r[1] * y + r[2] * z + t[0];
                          float wy = r[3] * x + r[4] * y + r[5] * z + t[1];
                          float wz = r[6] * x + r[7] * y + r[8] * z + t[2];
                          int p = i * 4;
                          int red = rgba != null && p + 2 < rgba.length ? rgba[p] & 255 : grayFromDepth(wz);
                          int green = rgba != null && p + 2 < rgba.length ? rgba[p + 1] & 255 : red;
                          int blue = rgba != null && p + 2 < rgba.length ? rgba[p + 2] & 255 : red;
                          addMapPoint(wx, wy, wz, red, green, blue);
                      }
                  }

                  private int grayFromDepth(float z) {
                      return Math.max(32, Math.min(220, (int) (220.0f - z * 28.0f)));
                  }

                  private void addMapPoint(float x, float y, float z, int red, int green, int blue) {
                      int vx = (int) Math.floor(x / VOXEL_SIZE);
                      int vy = (int) Math.floor(y / VOXEL_SIZE);
                      int vz = (int) Math.floor(z / VOXEL_SIZE);
                      long vk = pack(vx, vy, vz);
                      Integer existing = voxelIndex.get(vk);
                      if (existing != null) {
                          int idx = existing;
                          int n = Math.min(64, mapSamples[idx]);
                          float inv = 1.0f / (n + 1.0f);
                          int q = idx * 3;
                          mapXYZ[q] += (x - mapXYZ[q]) * inv;
                          mapXYZ[q + 1] += (y - mapXYZ[q + 1]) * inv;
                          mapXYZ[q + 2] += (z - mapXYZ[q + 2]) * inv;
                          int c = idx * 4;
                          mapRGBA[c] = (byte) ((mapRGBA[c] & 255) + (red - (mapRGBA[c] & 255)) * inv);
                          mapRGBA[c + 1] = (byte) ((mapRGBA[c + 1] & 255) + (green - (mapRGBA[c + 1] & 255)) * inv);
                          mapRGBA[c + 2] = (byte) ((mapRGBA[c + 2] & 255) + (blue - (mapRGBA[c + 2] & 255)) * inv);
                          mapSamples[idx] = Math.min(64, n + 1);
                          return;
                      }
                      if (mapCount >= MAX_POINTS) return;
                      int index = mapCount++;
                      int q = index * 3;
                      mapXYZ[q] = x; mapXYZ[q + 1] = y; mapXYZ[q + 2] = z;
                      int c = index * 4;
                      mapRGBA[c] = (byte) red; mapRGBA[c + 1] = (byte) green;
                      mapRGBA[c + 2] = (byte) blue; mapRGBA[c + 3] = (byte) 255;
                      mapSamples[index] = 1;
                      voxelIndex.put(vk, index);
                      long cellKey = pack(floorCell(x), floorCell(y), floorCell(z));
                      IntBucket bucket = spatialIndex.get(cellKey);
                      if (bucket == null) { bucket = new IntBucket(); spatialIndex.put(cellKey, bucket); }
                      bucket.add(index);
                  }

                  private static int floorCell(float value) { return (int) Math.floor(value / CELL_SIZE); }
                  private static long pack(int x, int y, int z) {
                      return (((long) x & 0x1fffffL) << 42)
                              | (((long) y & 0x1fffffL) << 21)
                              | ((long) z & 0x1fffffL);
                  }

                  public synchronized Snapshot snapshot() {
                      float[] xyz = new float[mapCount * 3];
                      byte[] rgba = new byte[mapCount * 4];
                      System.arraycopy(mapXYZ, 0, xyz, 0, xyz.length);
                      System.arraycopy(mapRGBA, 0, rgba, 0, rgba.length);
                      return new Snapshot(xyz, rgba, mapCount);
                  }

                  public void writePly(File file) throws IOException {
                      Snapshot data = snapshot(); // copy under lock; disk I/O happens without blocking frame fusion
                      if (data.pointCount == 0) throw new IOException("Нет накопленных точек. Сначала запустите сканирование.");
                      File parent = file.getParentFile();
                      if (parent != null && !parent.exists() && !parent.mkdirs())
                          throw new IOException("Не удалось создать каталог для PLY");
                      try (BufferedWriter writer = new BufferedWriter(new FileWriter(file), 256 * 1024)) {
                          writer.write("ply\nformat ascii 1.0\n");
                          writer.write("element vertex " + data.pointCount + "\n");
                          writer.write("property float x\nproperty float y\nproperty float z\n");
                          writer.write("property uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n");
                          for (int i = 0; i < data.pointCount; i++) {
                              int p = i * 3, c = i * 4;
                              writer.write(Float.toString(data.vertices[p])); writer.write(' ');
                              writer.write(Float.toString(data.vertices[p + 1])); writer.write(' ');
                              writer.write(Float.toString(data.vertices[p + 2])); writer.write(' ');
                              writer.write(Integer.toString(data.colors[c] & 255)); writer.write(' ');
                              writer.write(Integer.toString(data.colors[c + 1] & 255)); writer.write(' ');
                              writer.write(Integer.toString(data.colors[c + 2] & 255)); writer.write('\n');
                          }
                      }
                  }

                  private static boolean solveRigid(float[] src, float[] dst, int count,
                                                    float[] outR, float[] outT) {
                      if (count < 3) return false;
                      double sx = 0, sy = 0, sz = 0, tx = 0, ty = 0, tz = 0;
                      for (int i = 0; i < count; i++) {
                          int k = i * 3;
                          sx += src[k]; sy += src[k + 1]; sz += src[k + 2];
                          tx += dst[k]; ty += dst[k + 1]; tz += dst[k + 2];
                      }
                      double inv = 1.0 / count;
                      sx *= inv; sy *= inv; sz *= inv; tx *= inv; ty *= inv; tz *= inv;
                      double sxx = 0, sxy = 0, sxz = 0, syx = 0, syy = 0, syz = 0,
                              szx = 0, szy = 0, szz = 0;
                      for (int i = 0; i < count; i++) {
                          int k = i * 3;
                          double ax = src[k] - sx, ay = src[k + 1] - sy, az = src[k + 2] - sz;
                          double bx = dst[k] - tx, by = dst[k + 1] - ty, bz = dst[k + 2] - tz;
                          sxx += ax * bx; sxy += ax * by; sxz += ax * bz;
                          syx += ay * bx; syy += ay * by; syz += ay * bz;
                          szx += az * bx; szy += az * by; szz += az * bz;
                      }
                      double[][] n = new double[4][4];
                      n[0][0] = sxx + syy + szz;
                      n[0][1] = n[1][0] = syz - szy;
                      n[0][2] = n[2][0] = szx - sxz;
                      n[0][3] = n[3][0] = sxy - syx;
                      n[1][1] = sxx - syy - szz;
                      n[1][2] = n[2][1] = sxy + syx;
                      n[1][3] = n[3][1] = szx + sxz;
                      n[2][2] = -sxx + syy - szz;
                      n[2][3] = n[3][2] = syz + szy;
                      n[3][3] = -sxx - syy + szz;

                      double[][] eigenvectors = new double[4][4];
                      for (int i = 0; i < 4; i++) eigenvectors[i][i] = 1.0;
                      for (int iteration = 0; iteration < 40; iteration++) {
                          int p = 0, q = 1;
                          double largest = Math.abs(n[p][q]);
                          for (int i = 0; i < 4; i++) for (int j = i + 1; j < 4; j++) {
                              double value = Math.abs(n[i][j]);
                              if (value > largest) { largest = value; p = i; q = j; }
                          }
                          if (largest < 1e-10) break;
                          double theta = 0.5 * Math.atan2(2.0 * n[p][q], n[q][q] - n[p][p]);
                          double c = Math.cos(theta), s = Math.sin(theta);
                          double app = n[p][p], aqq = n[q][q], apq = n[p][q];
                          n[p][p] = c * c * app - 2 * s * c * apq + s * s * aqq;
                          n[q][q] = s * s * app + 2 * s * c * apq + c * c * aqq;
                          n[p][q] = n[q][p] = 0.0;
                          for (int k = 0; k < 4; k++) {
                              if (k == p || k == q) continue;
                              double akp = n[k][p], akq = n[k][q];
                              n[k][p] = n[p][k] = c * akp - s * akq;
                              n[k][q] = n[q][k] = s * akp + c * akq;
                          }
                          for (int k = 0; k < 4; k++) {
                              double vkp = eigenvectors[k][p], vkq = eigenvectors[k][q];
                              eigenvectors[k][p] = c * vkp - s * vkq;
                              eigenvectors[k][q] = s * vkp + c * vkq;
                          }
                      }
                      int best = 0;
                      for (int i = 1; i < 4; i++) if (n[i][i] > n[best][best]) best = i;
                      double qw = eigenvectors[0][best], qx = eigenvectors[1][best];
                      double qy = eigenvectors[2][best], qz = eigenvectors[3][best];
                      double norm = Math.sqrt(qw * qw + qx * qx + qy * qy + qz * qz);
                      if (norm < 1e-12) return false;
                      qw /= norm; qx /= norm; qy /= norm; qz /= norm;
                      outR[0] = (float) (1 - 2 * (qy * qy + qz * qz));
                      outR[1] = (float) (2 * (qx * qy - qz * qw));
                      outR[2] = (float) (2 * (qx * qz + qy * qw));
                      outR[3] = (float) (2 * (qx * qy + qz * qw));
                      outR[4] = (float) (1 - 2 * (qx * qx + qz * qz));
                      outR[5] = (float) (2 * (qy * qz - qx * qw));
                      outR[6] = (float) (2 * (qx * qz - qy * qw));
                      outR[7] = (float) (2 * (qy * qz + qx * qw));
                      outR[8] = (float) (1 - 2 * (qx * qx + qy * qy));
                      outT[0] = (float) (tx - (outR[0] * sx + outR[1] * sy + outR[2] * sz));
                      outT[1] = (float) (ty - (outR[3] * sx + outR[4] * sy + outR[5] * sz));
                      outT[2] = (float) (tz - (outR[6] * sx + outR[7] * sy + outR[8] * sz));
                      return true;
                  }

                  private static float[] identity3() { return new float[]{1,0,0, 0,1,0, 0,0,1}; }
                  private static float[] multiply3(float[] a, float[] b) {
                      float[] r = new float[9];
                      for (int row = 0; row < 3; row++) for (int col = 0; col < 3; col++)
                          r[row * 3 + col] = a[row * 3] * b[col] + a[row * 3 + 1] * b[3 + col]
                                  + a[row * 3 + 2] * b[6 + col];
                      return r;
                  }
                  private static float[] multiplyVector(float[] r, float[] v) {
                      return new float[]{r[0]*v[0]+r[1]*v[1]+r[2]*v[2],
                              r[3]*v[0]+r[4]*v[1]+r[5]*v[2],
                              r[6]*v[0]+r[7]*v[1]+r[8]*v[2]};
                  }
                  private static float length(float x, float y, float z) {
                      return (float) Math.sqrt(x*x + y*y + z*z);
                  }
                  private static float rotationAngle(float[] r) {
                      float c = Math.max(-1.0f, Math.min(1.0f, (r[0] + r[4] + r[8] - 1.0f) * 0.5f));
                      return (float) Math.acos(c);
                  }
              }
